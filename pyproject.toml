[project]
name = "journey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aly Mokhtari", email = "118989240+AlyMokhtari7@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
journey = "journey:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
